[project]
name = "dialgen-gemma"
version = "0.1.0"
description = "Generate bidirectional two-speaker JP dialogue text with google/gemma-4-12B-it for mstts input"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6.0",
    # gemma-4 unified processor imports torchvision (image) — required even for text-only
    "torchvision>=0.21.0",
    "torchaudio>=2.6.0",
    # gemma-4 (Gemma4UnifiedForConditionalGeneration) needs transformers 5.x (config says 5.10.0.dev0)
    "transformers @ git+https://github.com/huggingface/transformers.git",
    "accelerate>=0.34",
    "sentencepiece",
    "protobuf",
    "pillow",
    "huggingface_hub",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
